[project]
name = "agent-os"
version = "0.1.0"
description = "A local-first, context-isolated agentic OS and runtime for personal automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "jsonschema>=4.20.0",
    "mcp>=2.3.0",
    "starlette>=0.35.0",
    "uvicorn>=0.25.0",
    "fastembed>=0.9.0",
]

[project.scripts]
agent-os = "agent_os.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# TEMPORARY (ADR-0015): long prompt literals in modules scheduled for rewrite/deletion.
# Remove each entry when its phase lands; do not add new entries.
"src/agent_os/kernel/capability_scout.py" = ["E501"]  # deleted, Phase 21
"src/agent_os/kernel/pipeline.py" = ["E501"]  # rewritten, Phase 21
"src/agent_os/kernel/toolsmith.py" = ["E501"]  # rewritten, Phase 23
"src/agent_os/kernel/default_recipes.py" = ["E501"]  # migrated to contracts, Phase 20
"src/agent_os/kernel/recipe_tools.py" = ["E501"]  # rewritten on contracts, Phase 20
"src/agent_os/kernel/tool_management_tools.py" = ["E501"]  # rewritten, Phase 23
"tests/integration/test_self_developing_toolsmith.py" = ["E501"]  # rewritten, Phase 23
"tests/integration/test_end_to_end_dispatch.py" = ["E501"]  # rewritten, Phase 21

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
